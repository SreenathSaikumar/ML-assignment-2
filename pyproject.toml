[project]
name = "assignment-2"
version = "0.1.0"
description = "ML Assignment 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
